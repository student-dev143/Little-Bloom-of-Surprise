    <div id="love-letter-form">
        <form action="submit_form.php" method="POST">
            <label for="recipient">Who are we celebrating today?</label>
            <input type="text" id="recipient" name="recipient" required placeholder="Enter name">

             <label for="sender">Who’s about to get something special? </label>
            <input type="text" id="sender" name="sender" required placeholder="Enter your name">

            <label for="Date Of Birth">Date Of Birth</label>
            <input type="date" id="dob" name="Date" id="" placeholder="Enter Date of birth">

            <label for="message">💌What’s on your heart?</label>
            <textarea id="message" name="message" rows="5"maxlength="850" required placeholder="Enter your message from your heart"></textarea>

            <button type="submit" id="submit">Send Love Letter</button>
        </form>
