<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday-Form</title>
        <link rel="stylesheet" href="birthday-wishes.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
     <nav>
        <div class="left">
            <img src="spark-icon.png" alt="Spark Icon" class="spark-icon">
           <span id="brand-name">Birthday Surprise</span>
        </div>
           <div class="right">
            <a href="#home">Home</a>
        <a href="categories.html">Category</a>
       <a href="how-it-works.html">How it works</a>
        </div>
           <i class="ri-more-2-fill" id="menuToggle"></i>
        <div class="side-navbar" id="sideNavbar">
    <a href="index.html">Home</a>
    <a href="categories.html">Categories</a>
    <a href="how-it-works.html">How it works</a>
</div>
    </nav>
     <div class="birthday-form-card">

  <div class="form-header">
    <div class="gift-icon">🎁</div>

    <div>
      <h2>Send a Birthday Wish</h2>
      <p>Fill in the details below and let your words bring a smile.</p>
    </div>

    <span class="header-heart">♡</span>
  </div>

  <form>

    <div class="form-row">

      <div class="form-group">
        <label>♙ Recipient's Name <span>*</span></label>
        <input id="#recipient" type="text" placeholder="e.g. Ayesha Khan" required  >
      </div>

      <div class="form-group">
        <label>♙ Your Name <span>*</span></label>
        <input id="#sender" type="text" placeholder="e.g. Sarah Ahmed" required>
      </div>

    </div>


    <div class="form-row">

      <div class="form-group">
        <label>Secret Code 🔐</label>
        <input id="secret-code" type="number">
      </div>

      <div class="form-group">
        <label>♡ Your Relationship</label>
        <select>
          <option>Select an option</option>
          <option>Friend</option>
          <option>Best Friend</option>
          <option>Brother</option>
          <option>Sister</option>
          <option>Family</option>
          <option>Other</option>
        </select>
      </div>

    </div>


    <div class="form-group message-group">
      <label>▣ Your Birthday Message <span>*</span></label>

      <div class="textarea-box">
        <textarea id="message"
         rows="5"maxlength="850" required
          placeholder="Write your special message here..."
        ></textarea>

        <span>0/500</span>
      </div>
    </div>


    <button  id="submit"  class="send-btn">
      ✈ Send Birthday Wish
      <span>→</span>
    </button>

  </form>


  <div class="form-features">
    <div>♙ <span>Your message is private</span></div>
    <div>♡ <span>Spreads happiness</span></div>
    <div>☆ <span>Make it memorable</span></div>
  </div>
  <div id="generated-link" style="display: none;">
    <p>Your surprise link is ready! ✨</p>

    <input type="text" id="link-output" readonly>

    <button id="copy-btn">Copy Link</button>
</div>

</div>
</body>
<script src="birthday.js"></script>
</html>
